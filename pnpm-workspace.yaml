allowBuilds:
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

permissions:
  '@tanstack/charts':
    skills: true

skills:
  dirs:
    - .claude/skills
    - .agents/skills

publicHoistPattern:
  - vite

minimumReleaseAgeExclude:
    - '@astrojs/check@0.9.12'
    - '@astrojs/cloudflare@14.4.2'
    - '@astrojs/language-server@2.17.3'
    - '@astrojs/markdown-satteri@0.4.5'
    - '@astrojs/prism@4.1.1'
    - '@astrojs/react@7.1.1'
    - '@astrojs/telemetry@3.4.1'
    - astro@7.4.2
