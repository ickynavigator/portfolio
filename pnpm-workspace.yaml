permissions:
  '@tanstack/charts':
    skills: true
  core-js:
    build: true
  esbuild:
    build: true
  workerd:
    build: true

skills:
  dirs:
    - .claude/skills
    - .agents/skills

publicHoistPattern:
  - vite

minimumReleaseAgeExclude:
    - '@astrojs/cloudflare@14.4.7'
    - '@astrojs/internal-helpers@0.13.2'
    - '@astrojs/markdown-satteri@0.4.8'
    - '@astrojs/react-renderer@0.1.1'
    - '@astrojs/react@7.1.7'
    - '@astrojs/runtime@0.1.0'
    - '@astrojs/vite-plugin-astro@0.1.1'
    - astro@7.4.10
